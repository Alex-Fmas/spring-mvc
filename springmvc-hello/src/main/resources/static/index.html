<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Spring MVC 学习系统</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        .container{
            width:700px;
            margin:20px auto;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
            margin-bottom:20px;
        }

        .card h2{
            margin-top:0;
            color:#0078d7;
        }

        table{
            width:100%;
        }

        td{
            padding:8px;
        }

        input[type=text],
        input[type=password]{
            width:100%;
            padding:8px;
            box-sizing:border-box;
        }

        button{
            background:#0078d7;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#005fb8;
        }

        .todo{
            color:gray;
            font-style:italic;
        }
    </style>
</head>
<body>

<h1>Spring MVC 学习测试平台</h1>

<div class="container">

    <!-- 功能1 -->
    <div class="card">
        <h2>功能1：请求参数绑定测试</h2>

        <p>
            测试 Spring MVC 自动接收请求参数：
            username、password、cellphone、agreement
        </p>

        <form action="/handle01" method="post">

            <table>
                <tr>
                    <td>用户名：</td>
                    <td>
                        <input type="text"
                               name="username"
                               placeholder="请输入用户名">
                    </td>
                </tr>

                <tr>
                    <td>密码：</td>
                    <td>
                        <input type="password"
                               name="password"
                               placeholder="请输入密码">
                    </td>
                </tr>

                <tr>
                    <td>手机号：</td>
                    <td>
                        <input type="text"
                               name="cellphone"
                               placeholder="请输入手机号">
                    </td>
                </tr>

                <tr>
                    <td>用户协议：</td>
                    <td>
                        <label>
                            <input type="checkbox"
                                   name="agreement">
                            同意协议
                        </label>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <button type="submit">
                            提交测试
                        </button>
                    </td>
                </tr>
            </table>

        </form>
    </div>

    <!-- 后续功能预留 -->
    <div class="card">
        <h2>后续测试功能</h2>

        <ul>
            <li class="todo">RequestParam 注解测试</li>
            <li class="todo">PathVariable 路径变量测试</li>
            <li class="todo">POJO 对象绑定测试</li>
            <li class="todo">数组参数接收测试</li>
            <li class="todo">List 集合接收测试</li>
            <li class="todo">JSON 数据接收测试</li>
            <li class="todo">文件上传测试</li>
            <li class="todo">转发与重定向测试</li>
        </ul>
    </div>

</div>

</body>
</html>
